<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 404" width="1440" height="404" role="img" aria-labelledby="t d">
<title id="t">AGENT.ONE — от магазина к покупателю через AI</title>
<desc id="d">Три шага: продавец добавляет товары, AI-консультант отвечает с учётом каталога, покупатель выбирает.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0B1124"/><stop offset=".6" stop-color="#101431"/><stop offset="1" stop-color="#15112B"/></linearGradient>
  <linearGradient id="violet" x2="1" y2="1"><stop stop-color="#B69CFF"/><stop offset=".55" stop-color="#817BF8"/><stop offset="1" stop-color="#4F7BF1"/></linearGradient>
  <linearGradient id="edge" x2="1"><stop stop-color="#7179B8"/><stop offset=".5" stop-color="#A394FF"/><stop offset="1" stop-color="#5E7EE6"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#6159E7" stop-opacity=".27"/><stop offset="1" stop-color="#6159E7" stop-opacity="0"/></radialGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="20"/></filter>
  <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#080A20" flood-opacity=".8"/></filter>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#989DDF" stroke-opacity=".045"/></pattern>
</defs>
