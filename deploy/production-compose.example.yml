version: "3.8"

# AGENT.ONE Production Deployment Template
# This is a design/template — no real credentials.
# All values are placeholders. Replace before production use.

services:
  database:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-agentone}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
      POSTGRES_DB: ${DB_NAME:-agentone}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-agentone}"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Do NOT expose DB port to host in production
    # ports:
    #   - "5432:5432"

  app:
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    depends_on:
      database:
        condition: service_healthy
    environment:
      APP_ENV: production
      PORT: "${PORT:-8080}"
      DATABASE_URL: postgres://${DB_USER:-agentone}:${DB_PASSWORD:-change-me}@database:5432/${DB_NAME:-agentone}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS}
      SECURITY_HEADERS_ENABLED: "true"
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS}
      MAX_REQUEST_BODY_BYTES: "${MAX_REQUEST_BODY_BYTES:-1048576}"
      MAX_UPLOAD_BYTES: "${MAX_UPLOAD_BYTES:-5242880}"
      SERVER_READ_TIMEOUT_SECONDS: "${SERVER_READ_TIMEOUT_SECONDS:-15}"
      SERVER_WRITE_TIMEOUT_SECONDS: "${SERVER_WRITE_TIMEOUT_SECONDS:-60}"
      SERVER_IDLE_TIMEOUT_SECONDS: "${SERVER_IDLE_TIMEOUT_SECONDS:-60}"
      AUTH_FAILURE_LIMIT: "${AUTH_FAILURE_LIMIT:-5}"
      AUTH_FAILURE_WINDOW_SECONDS: "${AUTH_FAILURE_WINDOW_SECONDS:-300}"
      AUTH_LOCKOUT_SECONDS: "${AUTH_LOCKOUT_SECONDS:-600}"
      METRICS_ENABLED: "${METRICS_ENABLED:-false}"
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      OPS_STATUS_ENABLED: "${OPS_STATUS_ENABLED:-false}"
      AI_PROVIDER: ${AI_PROVIDER:-groq}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-llama-3.3-70b-versatile}
      AI_MODEL_FAST: ${AI_MODEL_FAST:-llama-3.1-8b-instant}
      AI_TIMEOUT_SECONDS: "${AI_TIMEOUT_SECONDS:-20}"
      AI_FALLBACK_ENABLED: "${AI_FALLBACK_ENABLED:-true}"
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=64M
    # Resource limits (adjust per environment)
    # deploy:
    #   resources:
    #     limits:
    #       memory: 512M
    #       cpus: "1.0"
    #     reservations:
    #       memory: 256M

volumes:
  pgdata:
  uploads:
